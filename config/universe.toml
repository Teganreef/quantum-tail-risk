# Asset universe, split into nested tiers: each tier = previous tier + `add`.
# Edit freely; the loader checks that tiers stay nested and have the right sizes.
# CEG was dropped (not enough history for a 5-year window); NRG took its slot (DECISIONS D3).
# SPY stays in n12 as the S&P 500 proxy for benchmark portfolios. In n24, SCHD/BND/VXUS
# replaced GLD/XLF/IWM so the benchmark portfolios are fully modeled from n24 up (DECISIONS D28).

[tiers.n6]
add = ["NOW", "GOOG", "NRG", "GLDM", "BTC-USD", "SOL-USD"]

[tiers.n12]
add = ["ISRG", "AMZN", "VST", "HOOD", "ETH-USD", "SPY"]

[tiers.n24]
add = ["QQQ", "VXUS", "TLT", "BND", "XLE", "XLU", "XLV", "SCHD", "NVDA", "MSFT", "AAPL", "META"]

[tiers.n48]
add = ["JPM", "XOM", "LLY", "UNH", "COST", "WMT", "KO", "PG", "JNJ", "CVX", "AVGO", "TSLA",
       "AMD", "CRM", "ORCL", "NFLX", "GS", "CAT", "LMT", "NEE", "SLV", "USO", "XLI", "XLP"]

[tiers.n96]
add = ["MA", "V", "BAC", "WFC", "MS", "BLK", "AXP", "PFE", "MRK", "ABBV", "TMO", "ABT",
       "AMGN", "GILD", "HD", "LOW", "MCD", "SBUX", "NKE", "DIS", "T", "VZ", "TMUS", "PEP",
       "BA", "GE", "HON", "DE", "UPS", "RTX", "INTC", "CSCO", "QCOM", "TXN", "IBM", "ADBE",
       "INTU", "AMAT", "MU", "PLTR", "COIN", "MSTR", "SOFI", "DUK", "SO", "XLK", "XLY", "XLB"]

# If a ticker fails data validation, the next unused name here takes its place
# (only for n96, so the top tier always has 96 assets). Every swap is logged.
[replacements]
ordered = ["SCHW", "LIN", "ACN", "PM", "MDT", "BMY", "CVS", "GD", "MMM", "ADP", "SPGI", "CMCSA"]

# Sector labels, used only for coloring charts.
